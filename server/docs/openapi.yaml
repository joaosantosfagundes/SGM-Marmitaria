        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
    delete:
      tags: [Clientes]
      operationId: inativarCliente
      summary: Inativar cliente
      description: 'Perfis: ADMIN e ATENDENTE. Preserva o cadastro e seu histórico. Não exige corpo.'
      responses:
        '200':
          $ref: '#/components/responses/Inativado'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /cliente/{id}/excluir:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [Clientes]
      operationId: excluirCliente
