              examples:
                aberto:
                  value:
                    id: 1
                    idUsuarioAbertura: 2
                    nomeUsuarioAbertura: Maria Silva
                    idUsuarioFechamento: null
                    nomeUsuarioFechamento: null
                    dataAbertura: '2026-10-11 11:00:00'
