      description: 'Perfis: ADMIN e ATENDENTE. Atualização parcial. Para reativar, envie ativo=true.'
      requestBody:
        $ref: '#/components/requestBodies/ClienteAtualizacao'
      responses:
        '200':
          description: Cliente atualizado.
          content:
            application/json:
