        '500':
          $ref: '#/components/responses/ErroInterno'
  /adicional:
    get:
      tags: [Adicionais]
      operationId: listarAdicionais
      summary: Listar adicionais
      description: 'Perfis: ADMIN, ATENDENTE e COZINHA. Inclui adicionais ativos e inativos.'
      responses:
        '200':
          description: Lista de adicionais.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Adicional'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
        '503':
          $ref: '#/components/responses/EstruturaPendente'
    post:
      tags: [Adicionais]
      operationId: criarAdicional
      summary: Cadastrar adicional
      description: 'Perfil: ADMIN. Nasce ativo. Nome tem até 100 caracteres e não pode repetir outro adicional ativo. Preço deve ser maior que zero (mínimo 0,01), com até duas casas decimais e no máximo 99999999.99. O vínculo com insumo e a quantidade são opcionais e não baixam estoque.'
      requestBody:
        $ref: '#/components/requestBodies/AdicionalCriacao'
      responses:
        '201':
          description: Adicional cadastrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Adicional'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '500':
          $ref: '#/components/responses/ErroInterno'
        '503':
          $ref: '#/components/responses/EstruturaPendente'
  /adicional/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Adicionais]
      operationId: obterAdicional
      summary: Buscar adicional por ID
      description: 'Perfis: ADMIN, ATENDENTE e COZINHA.'
      responses:
        '200':
          description: Adicional encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Adicional'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
        '503':
          $ref: '#/components/responses/EstruturaPendente'
    put:
      tags: [Adicionais]
      operationId: atualizarAdicional
      summary: Atualizar adicional ou reativar cadastro
      description: 'Perfil: ADMIN. Atualização parcial. Para reativar, envie ativo=true; a reativação também verifica nome duplicado entre ativos. Os campos opcionais id_insumo e quantidade_consumida aceitam null para remover seus valores.'
      requestBody:
        $ref: '#/components/requestBodies/AdicionalAtualizacao'
      responses:
        '200':
          description: Adicional atualizado.
          content:
