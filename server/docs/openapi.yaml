              schema:
                $ref: '#/components/schemas/Adicional'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '500':
          $ref: '#/components/responses/ErroInterno'
        '503':
          $ref: '#/components/responses/EstruturaPendente'
    delete:
      tags: [Adicionais]
      operationId: inativarAdicional
      summary: Inativar adicional
      description: 'Perfil: ADMIN. Preserva os vínculos no histórico do cardápio. Novos salvamentos e cópias não aceitam este adicional enquanto estiver inativo. Não exige corpo.'
      responses:
        '200':
          $ref: '#/components/responses/Inativado'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
        '503':
          $ref: '#/components/responses/EstruturaPendente'
  /adicional/{id}/excluir:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [Adicionais]
      operationId: excluirAdicional
      summary: Excluir adicional definitivamente
      description: 'Perfil: ADMIN. Pedidos ou cardápios vinculados impedem a exclusão; nesse caso use inativação. Não exige corpo.'
      responses:
        '200':
          $ref: '#/components/responses/Excluido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '500':
          $ref: '#/components/responses/ErroInterno'
        '503':
          $ref: '#/components/responses/EstruturaPendente'
  /cardapio:
    get:
      tags: [Cardápio]
      operationId: obterCardapio
      summary: Consultar cardápio de uma data
      description: |
        Perfis: ADMIN e ATENDENTE. Retorna preparações na ordem salva e adicionais com nome e
        preço atual do cadastro. Adicionais inativados após o salvamento continuam na consulta.
        Se a data não tiver cadastro, devolve 200 com id=null, existe=false e listas vazias.
      parameters:
        - name: data
          in: query
          required: true
          description: Data válida do cardápio no formato YYYY-MM-DD.
          schema:
            type: string
            format: date
          example: '2026-10-08'
      responses:
        '200':
          description: Cardápio cadastrado ou vazio para a data consultada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cardapio'
              examples:
                cadastrado:
                  summary: Cardápio com itens fixos, três alternativas e dois adicionais
                  value:
                    id: 1
                    data: '2026-10-08'
                    existe: true
                    preparacoes:
                      - {nome: Arroz, grupo: null}
                      - {nome: Feijão, grupo: null}
                      - {nome: Carne, grupo: Mistura}
                      - {nome: Frango, grupo: Mistura}
                      - {nome: Ovo, grupo: Mistura}
                    adicionais:
                      - {id: 3, nome: Ovo extra, preco: 2.5}
                      - {id: 5, nome: Farofa, preco: 1.5}
                vazio:
                  summary: Data sem cadastro
                  value:
                    id: null
                    data: '2026-10-09'
                    existe: false
                    preparacoes: []
                    adicionais: []
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          description: Usuário da sessão não encontrado. A ausência de cardápio nessa data retorna 200, não 404.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '500':
          $ref: '#/components/responses/ErroInterno'
        '503':
          $ref: '#/components/responses/EstruturaPendente'
    put:
      tags: [Cardápio]
      operationId: salvarCardapio
      summary: Criar ou substituir cardápio de uma data
      description: |
        Perfis: ADMIN e ATENDENTE. Substitui as preparações e adicionais numa transação.
        A ordem do array define a ordem das preparações. grupo=null é item fixo e grupo=Mistura
        é alternativa. Nomes são obrigatórios, até 150 caracteres, sem repetição dentro do
        mesmo grupo (ignora espaços e maiúsculas/minúsculas). adicionais é um array de IDs
        positivos, sem repetição, que devem existir e estar ativos. Arrays vazios são aceitos.
      requestBody:
        $ref: '#/components/requestBodies/CardapioGravacao'
      responses:
        '200':
          $ref: '#/components/responses/CardapioSalvo'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
        '503':
          $ref: '#/components/responses/EstruturaPendente'
  /cardapio/copiar:
    post:
      tags: [Cardápio]
      operationId: copiarCardapio
      summary: Reutilizar cardápio em outra data
      description: |
        Perfis: ADMIN e ATENDENTE. As datas devem ser válidas e diferentes, e a origem deve
        ter cadastro. Substitui o destino copiando nomes, grupos, ordem e adicionais. Usa as
        mesmas validações do salvamento; se um adicional da origem estiver inativo, rejeita
        a cópia antes de substituir o destino. A resposta é o cardápio da data de destino.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataOrigem, dataDestino]
              properties:
                dataOrigem:
                  type: string
                  format: date
                dataDestino:
                  type: string
                  format: date
            example:
              dataOrigem: '2026-10-08'
              dataDestino: '2026-10-14'
      responses:
        '200':
          $ref: '#/components/responses/CardapioSalvo'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          description: Cardápio da data de origem não cadastrado, ou usuário da sessão não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                msg: Não existe cardápio cadastrado para a data de origem.
        '500':
          $ref: '#/components/responses/ErroInterno'
        '503':
          $ref: '#/components/responses/EstruturaPendente'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: Cookie JWT httpOnly criado por POST /login. Faça login pela operação; o navegador envia o cookie automaticamente. Não é preenchido manualmente no botão Authorize.
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: ID do cadastro.
      schema:
        type: integer
        minimum: 1
      example: 1
  responses:
    DadosInvalidos:
      description: Dados ausentes ou inválidos; a mensagem informa a validação que falhou.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    NaoAutenticado:
      description: Cookie ausente ou inválido, sessão expirada ou usuário inativo. Faça login novamente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            msg: Necessário login!
    SemPermissao:
      description: O perfil não pode executar esta operação ou a alteração da própria conta é proibida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            msg: Sem permissão para esta ação
    NaoEncontrado:
      description: Cadastro solicitado não encontrado, ou usuário da sessão removido do banco.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Conflito:
      description: Cadastro duplicado ou exclusão bloqueada por vínculos existentes. Confira a mensagem retornada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    ErroInterno:
      description: Erro ao processar a requisição no servidor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    EstruturaPendente:
      description: A estrutura de adicionais ou cardápio no banco está desatualizada; aplique a migração informada na mensagem.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Inativado:
      description: Cadastro inativado com sucesso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Mensagem'
    Excluido:
      description: Cadastro excluído definitivamente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Mensagem'
    CardapioSalvo:
      description: Cardápio da data de destino, após o salvamento ou reutilização.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Cardapio'
  requestBodies:
    UsuarioAtualizacao:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UsuarioAtualizacao'
          example:
            nome: Maria Silva
            email: maria@example.com
            perfil: ATENDENTE
            ativo: true
    ProdutoCriacao:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ProdutoEntrada'
              - required: [nome, preco_padrao]
          example:
            nome: Marmita G
            descricao: Marmita grande
            preco_padrao: 25
    ProdutoAtualizacao:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProdutoEntrada'
          examples:
            editar:
              value: {nome: Marmita G, descricao: Marmita grande, preco_padrao: 27}
            reativar:
              value: {ativo: true}
    InsumoCriacao:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/InsumoEntrada'
              - required: [nome, id_categoria, id_unidade, classificacao, preco_custo]
          example:
            nome: Arroz cru
            id_categoria: 1
            id_unidade: 1
            classificacao: INSUMO
            preco_custo: 5.5
            preco_venda: 0
            estoque_minimo: 10
    InsumoAtualizacao:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InsumoEntrada'
          examples:
            editar:
              value: {preco_custo: 6, estoque_minimo: 12}
            reativar:
              value: {ativo: true}
    ClienteCriacao:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ClienteEntrada'
              - required: [nome]
          example:
            nome: Maria Silva
            telefone: '18999990000'
    ClienteAtualizacao:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClienteEntrada'
          examples:
            editar:
              value: {nome: Maria Silva, telefone: '18999990000'}
            reativar:
              value: {ativo: true}
    AdicionalCriacao:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/AdicionalEntrada'
              - required: [nome, preco]
          example:
            nome: Ovo extra
            preco: 2.5
            id_insumo: null
            quantidade_consumida: null
    AdicionalAtualizacao:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdicionalEntrada'
          examples:
            editar:
              value: {nome: Ovo extra, preco: 3, id_insumo: null, quantidade_consumida: null}
            reativar:
              value: {ativo: true}
    CardapioGravacao:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CardapioEntrada'
          example:
            data: '2026-10-08'
            preparacoes:
              - {nome: Arroz, grupo: null}
              - {nome: Feijão, grupo: null}
              - {nome: Carne, grupo: Mistura}
              - {nome: Frango, grupo: Mistura}
              - {nome: Ovo, grupo: Mistura}
            adicionais: [3, 5]
  schemas:
    Erro:
      type: object
      required: [msg]
      properties:
        msg:
          type: string
          description: Mensagem de erro em português.
    Mensagem:
      type: object
      required: [msg]
      properties:
        msg:
          type: string
          description: Mensagem de confirmação em português.
    Ativo:
      description: O mysql2 devolve BOOLEAN como 0 ou 1; entidades criadas ou atualizadas também podem devolver booleanos JSON.
      oneOf:
        - type: boolean
        - type: integer
          enum: [0, 1]
    DecimalSaida:
      description: DECIMAL é devolvido como string pelo mysql2; respostas de criação ou atualização também podem conter número.
      oneOf:
        - type: number
        - type: string
          pattern: '^-?\d+(\.\d+)?$'
    CriadoEm:
      type: string
      description: Data e hora do banco com dateStrings, quando disponíveis; pode ser omitido na resposta de criação.
      example: '2026-10-08 08:30:00'
    Perfil:
      type: string
      enum: [ADMIN, ATENDENTE, COZINHA]
    LoginEntrada:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          example: pessoa@example.com
        senha:
          type: string
          format: password
          writeOnly: true
          description: Senha da conta existente; preencha somente ao executar. Sem valor de exemplo.
    Usuario:
      type: object
      description: Dados públicos do usuário; senha e seu hash não são serializados.
      required: [id, nome, email, perfil, ativo]
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: Maria Silva
        email:
          type: string
          example: maria@example.com
        perfil:
          $ref: '#/components/schemas/Perfil'
        ativo:
          $ref: '#/components/schemas/Ativo'
        criadoEm:
          $ref: '#/components/schemas/CriadoEm'
    UsuarioCriacao:
      type: object
      required: [nome, email, senha, perfil]
      properties:
        nome:
          type: string
          minLength: 2
          example: Maria Silva
        email:
          type: string
          description: Deve conter arroba.
          example: maria@example.com
        senha:
          type: string
          format: password
          writeOnly: true
          description: Senha de entrada, sem exemplo. Não é devolvida pela API.
        perfil:
          $ref: '#/components/schemas/Perfil'
    UsuarioAtualizacao:
      type: object
      properties:
        nome:
          type: string
          minLength: 2
        email:
          type: string
        perfil:
          $ref: '#/components/schemas/Perfil'
        ativo:
          type: boolean
    Categoria:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: Grãos
        descricao:
          type: string
          nullable: true
          example: Grãos e cereais
        ativo:
          $ref: '#/components/schemas/Ativo'
    Unidade:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: Quilograma
        sigla:
          type: string
          example: kg
    ProdutoEntrada:
      type: object
      description: Na criação, ativo é ignorado e o produto nasce ativo. Na edição todos os campos são opcionais.
      properties:
        nome:
          type: string
          minLength: 2
        descricao:
          type: string
          nullable: true
        preco_padrao:
          type: number
          minimum: 0
          exclusiveMinimum: true
        ativo:
          type: boolean
    Produto:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: Marmita G
        descricao:
          type: string
          nullable: true
          example: Marmita grande
        precoPadrao:
          $ref: '#/components/schemas/DecimalSaida'
        ativo:
          $ref: '#/components/schemas/Ativo'
        criadoEm:
          $ref: '#/components/schemas/CriadoEm'
    InsumoEntrada:
      type: object
      description: Na criação, ativo é ignorado e o insumo nasce ativo. Na edição todos os campos são opcionais.
      properties:
        nome:
          type: string
          minLength: 2
        id_categoria:
          type: integer
          minimum: 1
        id_unidade:
          type: integer
          minimum: 1
        classificacao:
          type: string
          enum: [INSUMO, VENDA_DIRETA]
        preco_custo:
          type: number
          minimum: 0
          exclusiveMinimum: true
        preco_venda:
          type: number
          description: Obrigatoriamente positivo quando classificacao é VENDA_DIRETA.
        estoque_minimo:
          type: number
          minimum: 0
        ativo:
          type: boolean
    Insumo:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: Arroz cru
        idCategoria:
          type: integer
          example: 1
        idUnidade:
          type: integer
          example: 1
        classificacao:
          type: string
          enum: [INSUMO, VENDA_DIRETA]
        precoCusto:
          $ref: '#/components/schemas/DecimalSaida'
        precoVenda:
          $ref: '#/components/schemas/DecimalSaida'
        estoqueMinimo:
          $ref: '#/components/schemas/DecimalSaida'
        ativo:
          $ref: '#/components/schemas/Ativo'
        criadoEm:
          $ref: '#/components/schemas/CriadoEm'
    InsumoDetalhado:
      allOf:
        - $ref: '#/components/schemas/Insumo'
        - type: object
          properties:
            nomeCategoria:
              type: string
              example: Grãos
            nomeUnidade:
              type: string
              example: Quilograma
            siglaUnidade:
              type: string
              example: kg
    ClienteEntrada:
      type: object
      description: Na criação, ativo é ignorado e o cliente nasce ativo. Na edição todos os campos são opcionais.
      properties:
        nome:
          type: string
          minLength: 1
        telefone:
          type: string
          nullable: true
        ativo:
          type: boolean
    Cliente:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: Maria Silva
        telefone:
          type: string
          nullable: true
          example: '18999990000'
        ativo:
          $ref: '#/components/schemas/Ativo'
        criadoEm:
          $ref: '#/components/schemas/CriadoEm'
    AdicionalEntrada:
      type: object
      description: Na criação, ativo é ignorado e o adicional nasce ativo. Na edição todos os campos são opcionais; null remove os vínculos opcionais.
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 100
        preco:
          type: number
          minimum: 0.01
          maximum: 99999999.99
          multipleOf: 0.01
          description: Preço numérico obrigatório na criação, maior que zero, com até duas casas decimais.
        ativo:
          type: boolean
        id_insumo:
          type: integer
          minimum: 1
          nullable: true
          description: Deve existir, se preenchido. Vínculo informativo, sem baixa automática de estoque.
        quantidade_consumida:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 9999999.999
          multipleOf: 0.001
          nullable: true
    Adicional:
      type: object
      required: [id, nome, preco, ativo, idInsumo, quantidadeConsumida]
      properties:
        id:
          type: integer
          example: 3
        nome:
          type: string
          example: Ovo extra
        preco:
          type: number
          minimum: 0.01
          maximum: 99999999.99
          multipleOf: 0.01
          example: 2.5
        ativo:
          type: boolean
        idInsumo:
          type: integer
          nullable: true
          example: null
        quantidadeConsumida:
          type: number
          nullable: true
          example: null
    Preparacao:
      type: object
      required: [nome, grupo]
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 150
          example: Carne
        grupo:
          type: string
          nullable: true
          enum: [null, Mistura]
          description: null para item fixo, Mistura para uma alternativa. É obrigatório informar o campo, mesmo quando null.
    AdicionalDoDia:
      type: object
      required: [id, nome, preco]
      properties:
        id:
          type: integer
          example: 3
        nome:
          type: string
          example: Ovo extra
        preco:
          type: number
          example: 2.5
    CardapioEntrada:
      type: object
      required: [data, preparacoes, adicionais]
      properties:
        data:
          type: string
          format: date
        preparacoes:
          type: array
          description: Sem limite de opções; a posição no array define a ordem.
          items:
            $ref: '#/components/schemas/Preparacao'
        adicionais:
          type: array
          uniqueItems: true
          description: IDs de adicionais existentes e ativos, sem repetição.
          items:
            type: integer
            minimum: 1
    Cardapio:
      type: object
      required: [id, data, existe, preparacoes, adicionais]
      properties:
        id:
          type: integer
          nullable: true
        data:
          type: string
          format: date
        existe:
          type: boolean
          description: false para uma data sem cadastro.
        preparacoes:
          type: array
          items:
            $ref: '#/components/schemas/Preparacao'
        adicionais:
          type: array
          items:
            $ref: '#/components/schemas/AdicionalDoDia'
