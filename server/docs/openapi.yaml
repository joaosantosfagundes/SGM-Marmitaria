openapi: 3.0.3
info:
  title: SGM — API da Marmitaria
  version: 1.0.0
  description: |
    Documentação das rotas existentes do SGM. Os nomes de entrada e saída seguem o código atual;
    alguns cadastros recebem campos em snake_case e devolvem campos em camelCase.

    Para testar: abra POST /login, clique em Try it out, preencha email e senha de uma conta
    existente e execute. O navegador armazena o cookie httpOnly chamado token e o envia
    automaticamente nas próximas chamadas deste servidor. Não cole JWT no botão Authorize:
    o JavaScript não pode definir esse cookie manualmente. GET /login/usuario confirma a sessão;
    POST /login/logout encerra a sessão. Em produção, o cookie Secure exige HTTPS.

    As permissões estão descritas em cada operação. Ativar a documentação não libera acesso às
    rotas protegidas. Campos de senha e tokens de redefinição são apenas de entrada e não têm
    valores de exemplo. Datas do cardápio usam YYYY-MM-DD e não incluem horário.
servers:
  - url: /api
    description: API no mesmo servidor da documentação
security:
  - cookieAuth: []
tags:
  - name: Login
    description: Acesso e sessão por cookie httpOnly
  - name: Redefinição de senha
    description: Solicitação e confirmação de nova senha
  - name: Usuários
    description: Cadastro administrado somente pelo perfil ADMIN
  - name: Categorias
    description: Consulta de categorias ativas de insumos
  - name: Unidades
    description: Consulta de unidades de medida
  - name: Insumos
    description: Matérias-primas e materiais da cozinha
  - name: Produtos
    description: Itens vendáveis com preço fixo
  - name: Clientes
    description: Cadastro de clientes
  - name: Adicionais
    description: Adicionais com preço fixo e vínculo opcional com insumo
  - name: Cardápio
    description: Itens fixos, alternativas de mistura e adicionais de cada data
paths:
  /login:
    post:
      tags: [Login]
      operationId: fazerLogin
      summary: Entrar no sistema
      description: |
        Acesso público, sem cookie anterior. Informe email e senha de uma conta ativa.
        Retorna o usuário sem senha e define o cookie token, httpOnly, SameSite=Lax, com
        validade de oito horas. Em produção o cookie também é Secure.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginEntrada'
      responses:
        '200':
          description: Sessão criada; o navegador recebe o cookie automaticamente.
          headers:
            Set-Cookie:
              description: Cookie token com HttpOnly, SameSite=Lax e validade de oito horas; Secure em produção. O valor não é documentado.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [usuario]
                properties:
                  usuario:
                    $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          description: E-mail ou senha inválidos, ou usuário inativo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                msg: E-mail ou senha inválidos
        '500':
          $ref: '#/components/responses/ErroInterno'
  /login/usuario:
    get:
      tags: [Login]
      operationId: consultarSessao
      summary: Consultar o usuário da sessão
      description: 'Perfis: ADMIN, ATENDENTE e COZINHA. Consulta o usuário atual no banco e devolve seus dados sem senha.'
      responses:
        '200':
          description: Dados do usuário autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /login/logout:
    post:
      tags: [Login]
      operationId: encerrarSessao
      summary: Sair do sistema
      description: Acesso público. Remove o cookie token, inclusive quando não há sessão. Não exige corpo.
      security: []
      responses:
        '200':
          description: Cookie removido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                msg: Logout realizado
  /senha/esqueci-senha:
    post:
      tags: [Redefinição de senha]
      operationId: solicitarRedefinicao
      summary: Solicitar link de redefinição
      description: |
        Acesso público. A resposta é igual para e-mails cadastrados e não cadastrados.
        O link expira em uma hora. Sem serviço de e-mail configurado, o backend apresenta
        o link no console local, conforme o comportamento atual do serviço.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
            example:
              email: pessoa@example.com
      responses:
        '200':
          description: Solicitação processada sem revelar se o e-mail existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                msg: Se esse e-mail estiver cadastrado, enviamos um link de redefinição.
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /senha/redefinir-senha:
    post:
      tags: [Redefinição de senha]
      operationId: redefinirSenha
      summary: Definir uma nova senha
      description: Acesso público. Recebe o token do link e novaSenha com pelo menos seis caracteres. O token é invalidado após o uso.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, novaSenha]
              properties:
                token:
                  type: string
                  writeOnly: true
                  description: Token recebido no link de redefinição; preencha somente ao executar.
                novaSenha:
                  type: string
                  format: password
                  minLength: 6
                  writeOnly: true
                  description: Nova senha escolhida; preencha somente ao executar.
      responses:
        '200':
          description: Senha alterada; faça login com a nova senha.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensagem'
              example:
                msg: Senha redefinida com sucesso. Faça login com a nova senha.
        '400':
          description: Senha inválida ou link inválido, expirado ou já utilizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /usuario:
    get:
      tags: [Usuários]
      operationId: listarUsuarios
      summary: Listar usuários
      description: 'Perfil: ADMIN. Inclui usuários ativos e inativos, sempre sem senha.'
      responses:
        '200':
          description: Lista de usuários.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
    post:
      tags: [Usuários]
      operationId: criarUsuario
      summary: Cadastrar usuário
      description: 'Perfil: ADMIN. O usuário nasce ativo. O campo senha é somente de entrada; não há valor de exemplo.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCriacao'
      responses:
        '201':
          description: Usuário cadastrado, sem senha na resposta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /usuario/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Usuários]
      operationId: obterUsuario
      summary: Buscar usuário por ID
      description: 'Perfil: ADMIN. Devolve o usuário sem senha.'
      responses:
        '200':
          description: Usuário encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
    put:
      tags: [Usuários]
      operationId: atualizarUsuario
      summary: Atualizar usuário ou reativar cadastro
      description: 'Perfil: ADMIN. Atualização parcial. Não altera senha. O usuário logado não pode alterar seu próprio perfil nem desativar sua própria conta.'
      requestBody:
        $ref: '#/components/requestBodies/UsuarioAtualizacao'
      responses:
        '200':
          description: Usuário atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
    delete:
      tags: [Usuários]
      operationId: inativarUsuario
      summary: Inativar usuário
      description: 'Perfil: ADMIN. Preserva o cadastro. Não permite inativar sua própria conta. Não exige corpo.'
      responses:
        '200':
          $ref: '#/components/responses/Inativado'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /usuario/{id}/excluir:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [Usuários]
      operationId: excluirUsuario
      summary: Excluir usuário definitivamente
      description: 'Perfil: ADMIN. Não permite excluir sua própria conta nem um usuário com registros vinculados. Não exige corpo.'
      responses:
        '200':
          $ref: '#/components/responses/Excluido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /categoria:
    get:
      tags: [Categorias]
      operationId: listarCategorias
      summary: Listar categorias ativas
      description: 'Perfis: ADMIN, ATENDENTE e COZINHA. Esta rota é somente de consulta.'
      responses:
        '200':
          description: Lista de categorias ativas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Categoria'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /unidade:
    get:
      tags: [Unidades]
      operationId: listarUnidades
      summary: Listar unidades de medida
      description: 'Perfis: ADMIN, ATENDENTE e COZINHA. Esta rota é somente de consulta.'
      responses:
        '200':
          description: Lista de unidades.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Unidade'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /insumo:
    get:
      tags: [Insumos]
      operationId: listarInsumos
      summary: Listar insumos com categoria e unidade
      description: 'Perfis: ADMIN, ATENDENTE e COZINHA. Inclui ativos e inativos. A listagem acrescenta nomeCategoria, nomeUnidade e siglaUnidade.'
      responses:
        '200':
          description: Lista de insumos com detalhes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InsumoDetalhado'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
    post:
      tags: [Insumos]
      operationId: criarInsumo
      summary: Cadastrar insumo
      description: 'Perfil: ADMIN. Nasce ativo, exige categoria ativa, unidade existente e preço de custo positivo. VENDA_DIRETA exige preço de venda positivo.'
      requestBody:
        $ref: '#/components/requestBodies/InsumoCriacao'
      responses:
        '201':
          description: Insumo cadastrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Insumo'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /insumo/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Insumos]
      operationId: obterInsumo
      summary: Buscar insumo por ID
      description: 'Perfis: ADMIN, ATENDENTE e COZINHA. A resposta individual não inclui os nomes da categoria e da unidade.'
      responses:
        '200':
          description: Insumo encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Insumo'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
    put:
      tags: [Insumos]
      operationId: atualizarInsumo
      summary: Atualizar insumo ou reativar cadastro
      description: 'Perfil: ADMIN. Atualização parcial. Para reativar, envie ativo=true.'
      requestBody:
        $ref: '#/components/requestBodies/InsumoAtualizacao'
      responses:
        '200':
          description: Insumo atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Insumo'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '500':
          $ref: '#/components/responses/ErroInterno'
    delete:
      tags: [Insumos]
      operationId: inativarInsumo
      summary: Inativar insumo
      description: 'Perfil: ADMIN. Preserva o cadastro e seu histórico. Não exige corpo.'
      responses:
        '200':
          $ref: '#/components/responses/Inativado'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /insumo/{id}/excluir:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [Insumos]
      operationId: excluirInsumo
      summary: Excluir insumo definitivamente
      description: 'Perfil: ADMIN. Vínculos existentes podem impedir a exclusão; nesse caso use inativação. Não exige corpo.'
      responses:
        '200':
          $ref: '#/components/responses/Excluido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /produto:
    get:
      tags: [Produtos]
      operationId: listarProdutos
      summary: Listar produtos
      description: 'Perfis: ADMIN, ATENDENTE e COZINHA. Inclui produtos ativos e inativos.'
      responses:
        '200':
          description: Lista de produtos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Produto'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
    post:
      tags: [Produtos]
      operationId: criarProduto
      summary: Cadastrar produto
      description: 'Perfil: ADMIN. Nasce ativo. Exige nome com pelo menos dois caracteres e preço positivo. Nome já cadastrado gera conflito.'
      requestBody:
        $ref: '#/components/requestBodies/ProdutoCriacao'
      responses:
        '201':
          description: Produto cadastrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Produto'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /produto/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Produtos]
      operationId: obterProduto
      summary: Buscar produto por ID
      description: 'Perfis: ADMIN, ATENDENTE e COZINHA.'
      responses:
        '200':
          description: Produto encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Produto'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
    put:
      tags: [Produtos]
      operationId: atualizarProduto
      summary: Atualizar produto ou reativar cadastro
      description: 'Perfil: ADMIN. Atualização parcial. Recebe preco_padrao e devolve precoPadrao. Para reativar, envie ativo=true.'
      requestBody:
        $ref: '#/components/requestBodies/ProdutoAtualizacao'
      responses:
        '200':
          description: Produto atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Produto'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '500':
          $ref: '#/components/responses/ErroInterno'
    delete:
      tags: [Produtos]
      operationId: inativarProduto
      summary: Inativar produto
      description: 'Perfil: ADMIN. Preserva o cadastro e seu histórico. Não exige corpo.'
      responses:
        '200':
          $ref: '#/components/responses/Inativado'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /produto/{id}/excluir:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [Produtos]
      operationId: excluirProduto
      summary: Excluir produto definitivamente
      description: 'Perfil: ADMIN. Vínculos existentes podem impedir a exclusão; nesse caso use inativação. Não exige corpo.'
      responses:
        '200':
          $ref: '#/components/responses/Excluido'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /cliente:
    get:
      tags: [Clientes]
      operationId: listarClientes
      summary: Listar clientes
      description: 'Perfis: ADMIN e ATENDENTE. Inclui clientes ativos e inativos.'
      responses:
        '200':
          description: Lista de clientes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cliente'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
    post:
      tags: [Clientes]
      operationId: criarCliente
      summary: Cadastrar cliente
      description: 'Perfis: ADMIN e ATENDENTE. Nasce ativo. Nome é obrigatório; telefone é opcional. Telefone já cadastrado gera conflito na criação.'
      requestBody:
        $ref: '#/components/requestBodies/ClienteCriacao'
      responses:
        '201':
          description: Cliente cadastrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/Conflito'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /cliente/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Clientes]
      operationId: obterCliente
      summary: Buscar cliente por ID
      description: 'Perfis: ADMIN e ATENDENTE.'
      responses:
        '200':
          description: Cliente encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
    put:
      tags: [Clientes]
      operationId: atualizarCliente
