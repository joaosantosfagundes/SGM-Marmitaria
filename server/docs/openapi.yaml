          $ref: '#/components/responses/ErroInterno'
  /caixa/atual:
    get:
      tags: [Caixa]
      operationId: obterCaixaAtual
      summary: Consultar o caixa aberto
      description: 'Perfis: ADMIN e ATENDENTE. Retorna o único caixa ABERTO com nome de quem abriu e campos de fechamento (incluindo nomeUsuarioFechamento) null, ou null com status 200 quando não há caixa aberto.'
      responses:
