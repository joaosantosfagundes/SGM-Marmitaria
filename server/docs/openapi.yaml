                    valorFechamento: null
                    status: ABERTO
                semCaixa:
                  summary: Nenhum caixa aberto
                  value: null
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          description: Usuário da sessão não encontrado; a ausência de caixa aberto retorna 200 com null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /caixa/{id}/resumo:
    get:
      tags: [Caixa]
      operationId: obterResumoCaixa
      summary: Consultar resumo financeiro e conferência de um caixa
      description: |
        Perfis ADMIN e ATENDENTE. Consulta caixa aberto ou fechado pelo seu ID.
        Considera todo o período operacional, vinculando pedido.id_caixa a caixa.id_caixa
        e pagamento.id_pedido a pedido.id_pedido, sem filtro de data ou fuso horário.
        Cada pagamento é agregado uma única vez, sem joins com itens do pedido.
        Pedidos CANCELADO e pagamentos CANCELADO são excluídos.

        DINHEIRO, PIX, DEBITO e CREDITO somam somente pagamentos PAGO.
        totalFiado soma somente FIADO PENDENTE e não entra no totalRecebido.
        totalVendido = totalRecebido + totalFiado. A abertura não é faturamento.
        saldoEsperadoDinheiro = valorAbertura + totalDinheiro, usando pagamento.valor,
        nunca valor_recebido; o valor líquido da venda já desconta o troco.
        valor_recebido null equivale ao pagamento exato e não altera o cálculo.

        Para caixa fechado, diferenca = valorFechamento - saldoEsperadoDinheiro;
        zero indica conferido, positivo sobra e negativo falta. Em caixa aberto é null.
        quantidadePagamentos conta somente os pagamentos incluídos em cada categoria.
        Não considera sangrias, suprimentos, despesas, taxas ou quitação posterior de FIADO.
        O resumo é calculado na consulta, sem saldo acumulado ou snapshot salvo no banco.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Resumo financeiro do caixa, com valores numéricos e conferência.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResumoCaixa'}
              examples:
                aberto:
                  value:
                    idCaixa: 1
                    status: ABERTO
                    valorAbertura: 150
                    totalDinheiro: 40
                    totalPix: 80
                    totalDebito: 70
                    totalCredito: 50
                    totalFiado: 30
                    totalRecebido: 240
                    totalVendido: 270
                    saldoEsperadoDinheiro: 190
                    valorFechamento: null
                    diferenca: null
                    quantidadePagamentos: {dinheiro: 1, pix: 1, debito: 1, credito: 1, fiado: 1}
                fechadoComFalta:
                  value:
                    idCaixa: 1
                    status: FECHADO
                    valorAbertura: 150
                    totalDinheiro: 40
                    totalPix: 0
                    totalDebito: 0
                    totalCredito: 0
                    totalFiado: 0
                    totalRecebido: 40
                    totalVendido: 40
                    saldoEsperadoDinheiro: 190
                    valorFechamento: 185
                    diferenca: -5
                    quantidadePagamentos: {dinheiro: 1, pix: 0, debito: 0, credito: 0, fiado: 0}
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          description: Caixa não encontrado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Erro'}
              example: {msg: Caixa não encontrado.}
        '409':
          description: Totais acima do limite de precisão monetária suportado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Erro'}
        '500':
          $ref: '#/components/responses/ErroInterno'
  /caixa/abrir:
    post:
      tags: [Caixa]
      operationId: abrirCaixa
      summary: Abrir caixa com o troco inicial
      description: |
        Perfis: ADMIN e ATENDENTE. Quem abriu é definido pelo usuário autenticado;
        id_usuario e outros campos de responsável no corpo são ignorados.
        valorAbertura deve ser número entre 0 e 99999999.99, com até duas casas decimais.
        Zero é permitido. O corpo JSON usa ponto decimal, não vírgula ou string.
        É possível abrir vários caixas na mesma data, desde que o anterior esteja FECHADO.
        Só um caixa pode permanecer ABERTO; duas tentativas simultâneas também são protegidas
        pela UNIQUE do banco. Após o fechamento, é possível abrir um novo caixa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaixaAbertura'
            examples:
              comTroco:
                value: {valorAbertura: 100}
              semTroco:
                value: {valorAbertura: 0}
      responses:
        '201':
          description: Caixa criado, incluindo nome do responsável e data de abertura registrada pelo banco.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Caixa'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: Já existe caixa aberto, inclusive em uma tentativa de abertura simultânea.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                msg: Já existe um caixa aberto. Feche-o antes de abrir outro.
        '500':
          $ref: '#/components/responses/ErroInterno'
  /caixa/fechar:
    post:
      tags: [Caixa]
      operationId: fecharCaixa
      summary: Fechar caixa com o valor contado na gaveta
      description: |
        Perfis: ADMIN e ATENDENTE. Qualquer um desses perfis pode fechar o caixa ABERTO,
        mesmo que outra pessoa o tenha aberto. O responsável pelo fechamento é definido
        pelo usuário autenticado; campos de responsável enviados no corpo são ignorados.
        valorFechamento é somente o dinheiro contado na gaveta; o resumo é calculado separadamente.
        Deve ser número entre 0 e 99999999.99, com até duas casas decimais; zero é permitido.
        O corpo JSON usa ponto decimal, não vírgula ou string. O banco registra data/hora.
        idCaixa é opcional. Quando enviado, somente esse caixa pode ser fechado; se já
        estiver fechado ou não existir, retorna 409 sem fechar outro caixa. O corpo antigo
        com apenas valorFechamento continua fechando o caixa aberto.
        O update é condicional ao status ABERTO e executado em transação com leitura da
        resposta na mesma conexão. Seu bloqueio exclusivo aguarda pedidos que já têm FOR SHARE.
        Pedidos posteriores ao fechamento não podem se vincular a esse caixa.
        Diferenças de dinheiro não bloqueiam o fechamento. Consulte o resumo após fechar
        para conferir os valores finais, incluindo pedidos concluídos enquanto se confirmava.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaixaFechamento'
            examples:
              comDinheiro:
                value: {valorFechamento: 150}
              gavetaVazia:
                value: {valorFechamento: 0}
              caixaConferidoNaTela:
                value: {valorFechamento: 185, idCaixa: 1}
      responses:
        '200':
          description: Caixa fechado, incluindo nomes de quem abriu e de quem fechou, valor contado e data/hora do fechamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Caixa'
              example:
                id: 1
                idUsuarioAbertura: 2
                nomeUsuarioAbertura: Maria Silva
                idUsuarioFechamento: 3
                nomeUsuarioFechamento: João Souza
                dataAbertura: '2026-10-16 08:00:00'
                dataFechamento: '2026-10-16 15:00:00'
                valorAbertura: 100
                valorFechamento: 150
                status: FECHADO
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: Não existe caixa aberto ou outra tentativa já fechou o mesmo caixa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                msg: Não há caixa aberto para fechar.
        '500':
          $ref: '#/components/responses/ErroInterno'
  /estoque:
    get:
      tags: [Estoque]
      operationId: listarSaldosEstoque
      summary: Consultar o saldo de todos os insumos
      description: |
        Perfis: ADMIN, ATENDENTE e COZINHA. Inclui insumos ativos e inativos,
        em ordem de nome e ID. O ID retornado é o do insumo. Insumos sem linha
        em estoque aparecem com quantidade zero. abaixoDoMinimo é true somente
        quando quantidade < estoqueMinimo. Quantidades DECIMAL são devolvidas como números.
      responses:
        '200':
          description: Saldos dos insumos, ou lista vazia.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Estoque'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /estoque/movimentacoes:
    get:
      tags: [Estoque]
      operationId: listarMovimentacoesEstoque
      summary: Consultar o histórico de movimentações de estoque
      description: |
        Perfis: ADMIN, ATENDENTE e COZINHA. Retorna movimentações em ordem
        decrescente de data/hora e ID, sem restringir ao dia atual. Inclui o
        nome do insumo, a sigla da unidade e o usuário que registrou.
        IDs de insumos sem movimentações retornam lista vazia.
      parameters:
        - name: idInsumo
          in: query
          required: false
          description: Filtra pelo ID do insumo, incluindo insumos inativos.
          schema:
            type: integer
            minimum: 1
        - name: limite
          in: query
          required: false
          description: Número máximo de registros. Valores fora de 1 a 200 são recusados com 400.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Histórico, limitado conforme a consulta, ou lista vazia.
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items:
                  $ref: '#/components/schemas/MovimentacaoEstoque'
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
    post:
      tags: [Estoque]
      operationId: registrarMovimentacaoEstoque
      summary: Registrar uma entrada, perda ou ajuste manual
      description: |
        Perfis: ADMIN e COZINHA. ATENDENTE não pode registrar. O insumo deve existir
        e estar ativo. O usuário é obtido da sessão JWT; campos de responsável no
        corpo são ignorados. Não há vínculo com pedidos, adicionais ou cardápio.

        A quantidade é sempre positiva: ENTRADA_COMPRA e AJUSTE_ENTRADA somam;
        PERDA e AJUSTE_SAIDA subtraem. Aceita até três casas decimais e no máximo
        9999999.999. O JSON recebe número, sem vírgula decimal ou string.
        Motivo é obrigatório, com 3 a 255 caracteres após remover espaços nas
        extremidades, para perdas e ajustes; é opcional para entrada de compra.
        Em todos os tipos, o texto enviado não pode ultrapassar 255 caracteres.

        Saldo e histórico são gravados na mesma transação com conexão dedicada,
        bloqueio do insumo e SELECT FOR UPDATE do estoque. Se não houver linha de
        estoque, ela é criada com zero nessa transação. Saldo insuficiente ou acima
        de 9999999.999 retorna 409 e desfaz toda a operação, inclusive a criação da linha.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovimentacaoEstoqueEntrada'
            examples:
              compra:
                value: {idInsumo: 1, tipo: ENTRADA_COMPRA, quantidade: 10, motivo: null}
              perda:
                value: {idInsumo: 1, tipo: PERDA, quantidade: 3, motivo: Produto vencido}
              ajusteEntrada:
                value: {idInsumo: 1, tipo: AJUSTE_ENTRADA, quantidade: 0.5, motivo: Conferência física do estoque}
              ajusteSaida:
                value: {idInsumo: 1, tipo: AJUSTE_SAIDA, quantidade: 0.5, motivo: Correção após contagem}
      responses:
        '201':
          description: Movimentação registrada e novo saldo confirmado pela transação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovimentacaoEstoqueResultado'
              example:
                movimentacao:
                  id: 2
                  idInsumo: 1
                  nomeInsumo: Arroz
                  siglaUnidade: kg
                  idUsuario: 3
                  nomeUsuario: Maria Silva
                  tipo: PERDA
                  quantidade: 3
                  motivo: Produto vencido
                  dataHora: '2026-10-19 14:30:00'
                novoSaldo: 7
        '400':
          description: Dados inválidos ou insumo inativo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          description: Insumo ou usuário da sessão não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '409':
          description: A saída excede o saldo disponível ou a entrada ultrapassa a capacidade do estoque. Nada é gravado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                msg: 'Saldo insuficiente: disponível 7.'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /pedido:
    post:
      tags: [Pedidos]
      operationId: criarPedido
      summary: Lançar pedido e registrar o pagamento
      description: |
        Perfis ADMIN e ATENDENTE. COZINHA não pode criar. Exige caixa ABERTO;
        o caixa e o usuário são definidos pelo servidor, ignorando campos de responsável
        ou preço no corpo. Status inicial RECEBIDO. Não há baixa de estoque.
        Tudo é consultado e gravado em uma transação com conexão dedicada e caixa FOR SHARE.
        Qualquer erro desfaz pedido, itens, adicionais e pagamento.

        data é a data local do cardápio informada pelo cliente (AAAA-MM-DD), sem calcular hoje.
        Produtos ativos usam seus preços atuais. Se usaCardapio for true, exige cardápio
        cadastrado para essa data com ao menos uma preparação; ausente ou vazio retorna 409.
        Produtos com usaCardapio false continuam disponíveis sem cardápio. A mistura deve
        corresponder às opções do grupo Mistura dessa data, ignorando caixa e espaços;
        grava-se o nome original. Sem opções, mistura deve ser null. Adicionais devem
        estar ativos e marcados no cardápio. Produto com usaCardapio false não aceita mistura nem adicionais.
        A quantidade de cada adicional deve ser inteira de 1 a 99 e é o total da linha,
        sem multiplicar pela quantidade do produto.
        Os preços são preservados no histórico. Subtotais e total têm limite de 99999999.99.

        DELIVERY exige endereço com 5 a 255 caracteres. MESA e BALCAO exigem endereço null.
        Cliente informado deve estar ativo. FIADO exige cliente e gera pagamento PENDENTE;
        demais formas geram PAGO. Para DINHEIRO, valorRecebido é opcional; omitido ou null,
        grava-se null e o troco fica null. Se informado, deve ser numérico, com até duas casas,
        entre o total e 99999999.99. Outras formas não aceitam o campo valorRecebido,
        nem mesmo null. Troco é calculado quando houver valor recebido e retornado, nunca gravado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoEntrada'
            example:
              data: '2026-10-22'
              tipoAtendimento: BALCAO
              idCliente: null
              enderecoEntrega: null
              observacao: sem cebola
              itens:
                - idProduto: 1
                  quantidade: 2
                  opcaoMistura: Frango
                  adicionais: [{idAdicional: 3, quantidade: 1}]
              pagamento: {forma: DINHEIRO, valorRecebido: 50}
      responses:
        '201':
          description: Pedido completo com preços do servidor e pagamento registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
              example:
                id: 1
                idCaixa: 2
                idUsuario: 4
                nomeUsuario: Maria Silva
                idCliente: null
                nomeCliente: null
                dataHora: '2026-10-22 12:30:00'
                status: RECEBIDO
                tipoAtendimento: BALCAO
                enderecoEntrega: null
                observacao: sem cebola
                valorTotal: 42.5
                itens:
                  - id: 1
                    idProduto: 1
                    nomeProduto: Marmita G
                    quantidade: 2
                    precoUnitario: 20
                    subtotal: 40
                    opcaoMistura: Frango
                    observacao: null
                    adicionais: [{id: 1, idAdicional: 3, nomeAdicional: Ovo extra, quantidade: 1, precoUnitario: 2.5, subtotal: 2.5}]
                pagamento: {id: 1, forma: DINHEIRO, status: PAGO, valor: 42.5, valorRecebido: 50, troco: 7.5, dataHora: '2026-10-22 12:30:00'}
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: Sem caixa aberto, cardápio ausente/vazio para produto que o utiliza ou catálogo com preço inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                semCaixa:
                  value: {msg: Abra o caixa antes de lançar pedidos.}
                cardapioAusenteOuVazio:
                  value: {msg: Monte o cardápio do dia antes de lançar este produto.}
        '500':
          $ref: '#/components/responses/ErroInterno'
    get:
      tags: [Pedidos]
      operationId: listarPedidos
      summary: Consultar pedidos resumidos
      description: |
        Perfis ADMIN, ATENDENTE e COZINHA. Ordem decrescente de data/hora e ID.
        data é opcional e filtra o dia informado por intervalo de data_hora, do início
        desse dia (inclusive) até o início do dia seguinte (exclusive), sem função na coluna.
        A sessão MySQL usa deslocamento fixo -03:00. Não calcula hoje automaticamente.
        Os filtros data, status e idCaixa podem ser usados juntos.
        Com data, o limite padrão é 200; sem data é 50. O máximo continua 200.
      parameters:
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/StatusPedido'}
        - name: idCaixa
          in: query
          schema: {type: integer, minimum: 1}
        - name: data
          in: query
          description: Data real no formato AAAA-MM-DD; consulta os pedidos desse dia. Data inválida retorna 400.
          schema: {type: string, format: date}
          example: '2026-10-22'
        - name: limite
          in: query
          description: Padrão 200 quando data é informada; 50 quando data é omitida. Máximo 200.
          schema: {type: integer, minimum: 1, maximum: 200}
      responses:
        '200':
          description: Lista resumida, possivelmente vazia.
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items: {$ref: '#/components/schemas/PedidoResumo'}
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /pedido/{id}:
    get:
      tags: [Pedidos]
      operationId: obterPedido
      summary: Consultar pedido completo
      description: Perfis ADMIN, ATENDENTE e COZINHA. Retorna preços da venda, troco calculado, horários de preparo/saída e os dados de cancelamento.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Pedido completo.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Pedido'}
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '500':
          $ref: '#/components/responses/ErroInterno'
  /pedido/{id}/status:
    put:
      tags: [Pedidos]
      operationId: alterarStatusPedido
      summary: Avançar o status do pedido
      description: >-
        Perfis ADMIN, ATENDENTE e COZINHA. Um passo por vez: RECEBIDO → EM_PREPARO → PRONTO → SAIU_ENTREGA. SAIU_ENTREGA exige DELIVERY e perfil ADMIN ou ATENDENTE. Pedidos CANCELADO não podem avançar. Bloqueia o pedido com for update e confere o status anterior no update, na mesma transação. Registra horaPronto e horaSaiuEntrega nas respectivas etapas.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PedidoStatusEntrada'}
            example: {status: EM_PREPARO}
      responses:
        '200':
          description: Pedido completo atualizado, com itens, pagamento, horários e dados de cancelamento.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Pedido'}
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: Etapa inválida, pedido cancelado ou alteração concorrente.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Erro'}
              example: {msg: 'O pedido foi alterado por outra pessoa. Atualize a lista.'}
        '500':
          $ref: '#/components/responses/ErroInterno'
  /pedido/{id}/cancelar:
    post:
      tags: [Pedidos]
      operationId: cancelarPedido
      summary: Cancelar pedido e pagamentos
      description: >-
        Perfis ADMIN e ATENDENTE. Exige motivo com 3 a 255 caracteres após remover espaços nas pontas. Pode cancelar em qualquer etapa, enquanto o caixa vinculado estiver ABERTO. Na mesma transação bloqueia o pedido com for update, consulta o caixa com for share e cancela TODOS os pagamentos. O responsável vem do JWT. Não altera estoque nem exclui registros. Cancelados deixam de compor o resumo financeiro existente.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PedidoCancelamentoEntrada'}
            example: {motivo: Cliente desistiu do pedido}
      responses:
        '200':
          description: Pedido completo atualizado, com itens, pagamento, horários e dados de cancelamento.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Pedido'}
        '400':
          $ref: '#/components/responses/DadosInvalidos'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          description: Pedido já cancelado, caixa fechado ou alteração concorrente.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Erro'}
              example: {msg: 'Não é possível cancelar: o caixa deste pedido já foi fechado.'}
        '500':
          $ref: '#/components/responses/ErroInterno'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: Cookie JWT httpOnly criado por POST /login. Faça login pela operação; o navegador envia o cookie automaticamente. Não é preenchido manualmente no botão Authorize.
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: ID do cadastro.
      schema:
        type: integer
        minimum: 1
      example: 1
  responses:
    DadosInvalidos:
      description: Dados ausentes ou inválidos; a mensagem informa a validação que falhou.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    NaoAutenticado:
      description: Cookie ausente ou inválido, sessão expirada ou usuário inativo. Faça login novamente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            msg: Necessário login!
    SemPermissao:
      description: O perfil não pode executar esta operação ou a alteração da própria conta é proibida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            msg: Sem permissão para esta ação
    NaoEncontrado:
      description: Cadastro solicitado não encontrado, ou usuário da sessão removido do banco.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Conflito:
      description: Cadastro duplicado ou exclusão bloqueada por vínculos existentes. Confira a mensagem retornada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    ErroInterno:
      description: Erro ao processar a requisição no servidor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    EstruturaPendente:
      description: A estrutura de adicionais ou cardápio no banco está desatualizada; aplique a migração informada na mensagem.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Inativado:
      description: Cadastro inativado com sucesso.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Mensagem'
    Excluido:
      description: Cadastro excluído definitivamente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Mensagem'
    CardapioSalvo:
      description: Cardápio da data de destino, após o salvamento ou reutilização.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Cardapio'
  requestBodies:
    UsuarioAtualizacao:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UsuarioAtualizacao'
          example:
            nome: Maria Silva
            email: maria@example.com
            perfil: ATENDENTE
            ativo: true
    ProdutoCriacao:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ProdutoEntrada'
              - required: [nome, preco_padrao]
          example:
            nome: Marmita G
            descricao: Marmita grande
            preco_padrao: 25
    ProdutoAtualizacao:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProdutoEntrada'
          examples:
            editar:
              value: {nome: Marmita G, descricao: Marmita grande, preco_padrao: 27}
            reativar:
              value: {ativo: true}
    InsumoCriacao:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/InsumoEntrada'
              - required: [nome, id_categoria, id_unidade, classificacao, preco_custo]
          example:
            nome: Arroz cru
            id_categoria: 1
            id_unidade: 1
            classificacao: INSUMO
            preco_custo: 5.5
            preco_venda: 0
            estoque_minimo: 10
    InsumoAtualizacao:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InsumoEntrada'
          examples:
            editar:
              value: {preco_custo: 6, estoque_minimo: 12}
            reativar:
              value: {ativo: true}
    ClienteCriacao:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ClienteEntrada'
              - required: [nome]
          example:
            nome: Maria Silva
            telefone: '18999990000'
    ClienteAtualizacao:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClienteEntrada'
          examples:
            editar:
              value: {nome: Maria Silva, telefone: '18999990000'}
            reativar:
              value: {ativo: true}
    AdicionalCriacao:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/AdicionalEntrada'
              - required: [nome, preco]
          example:
            nome: Ovo extra
            preco: 2.5
            id_insumo: null
            quantidade_consumida: null
    AdicionalAtualizacao:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdicionalEntrada'
          examples:
            editar:
              value: {nome: Ovo extra, preco: 3, id_insumo: null, quantidade_consumida: null}
            reativar:
              value: {ativo: true}
    CardapioGravacao:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CardapioEntrada'
          example:
            data: '2026-10-08'
            preparacoes:
              - {nome: Arroz, grupo: null}
              - {nome: Feijão, grupo: null}
              - {nome: Carne, grupo: Mistura}
              - {nome: Frango, grupo: Mistura}
              - {nome: Ovo, grupo: Mistura}
            adicionais: [3, 5]
  schemas:
    DinheiroPedido:
      type: number
      minimum: 0
      maximum: 99999999.99
      multipleOf: 0.01
    StatusPedido:
      type: string
      enum: [RECEBIDO, EM_PREPARO, PRONTO, SAIU_ENTREGA, CANCELADO]
    PedidoStatusEntrada:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [EM_PREPARO, PRONTO, SAIU_ENTREGA]
          description: Próximo passo do pedido; não permite pular, repetir ou voltar. COZINHA não pode SAIU_ENTREGA.
    PedidoCancelamentoEntrada:
      type: object
      required: [motivo]
      properties:
        motivo:
          type: string
          minLength: 3
          maxLength: 255
          example: Cliente desistiu do pedido
    TipoAtendimento:
      type: string
      enum: [BALCAO, MESA, DELIVERY]
    FormaPagamentoPedido:
      type: string
      enum: [DINHEIRO, PIX, DEBITO, CREDITO, FIADO]
    PedidoAdicionalEntrada:
      type: object
      required: [idAdicional, quantidade]
      properties:
        idAdicional: {type: integer, minimum: 1}
        quantidade:
          type: integer
          minimum: 1
          maximum: 99
          description: Quantidade inteira de 1 a 99, total do adicional na linha; o subtotal e o total também devem caber em DECIMAL(10,2).
    PedidoItemEntrada:
      type: object
      required: [idProduto, quantidade]
      properties:
        idProduto: {type: integer, minimum: 1}
        quantidade: {type: integer, minimum: 1, maximum: 99}
        opcaoMistura: {type: string, nullable: true, maxLength: 150}
        observacao: {type: string, nullable: true, maxLength: 255}
        adicionais:
          type: array
          items: {$ref: '#/components/schemas/PedidoAdicionalEntrada'}
    PedidoPagamentoEntrada:
      type: object
      required: [forma]
      properties:
        forma: {$ref: '#/components/schemas/FormaPagamentoPedido'}
        valorRecebido:
          type: number
          nullable: true
          minimum: 0
          maximum: 99999999.99
          multipleOf: 0.01
          description: Opcional para DINHEIRO; omitido ou null, valor recebido e troco ficam null. Se informado, deve ser maior ou igual ao total. Não enviar em outras formas, nem mesmo null.
    PedidoEntrada:
      type: object
      required: [data, tipoAtendimento, itens, pagamento]
      properties:
        data: {type: string, format: date, example: '2026-10-22'}
        tipoAtendimento: {$ref: '#/components/schemas/TipoAtendimento'}
        idCliente: {type: integer, minimum: 1, nullable: true}
        enderecoEntrega: {type: string, nullable: true, maxLength: 255, description: Obrigatório com 5 a 255 caracteres para DELIVERY; null nos outros tipos.}
        observacao: {type: string, nullable: true, maxLength: 255}
        itens:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/PedidoItemEntrada'}
        pagamento: {$ref: '#/components/schemas/PedidoPagamentoEntrada'}
    PedidoAdicional:
      type: object
      required: [id, idAdicional, nomeAdicional, quantidade, precoUnitario, subtotal]
      properties:
        id: {type: integer}
        idAdicional: {type: integer}
        nomeAdicional: {type: string}
        quantidade: {type: integer, minimum: 1, maximum: 99}
        precoUnitario: {$ref: '#/components/schemas/DinheiroPedido'}
        subtotal: {$ref: '#/components/schemas/DinheiroPedido'}
    PedidoItem:
      type: object
      required: [id, idProduto, nomeProduto, quantidade, precoUnitario, subtotal, opcaoMistura, observacao, adicionais]
      properties:
        id: {type: integer}
        idProduto: {type: integer}
        nomeProduto: {type: string}
        quantidade: {type: integer}
        precoUnitario: {$ref: '#/components/schemas/DinheiroPedido'}
        subtotal: {$ref: '#/components/schemas/DinheiroPedido'}
        opcaoMistura: {type: string, nullable: true}
        observacao: {type: string, nullable: true}
        adicionais:
          type: array
          items: {$ref: '#/components/schemas/PedidoAdicional'}
    PedidoPagamento:
      type: object
      required: [id, forma, status, valor, valorRecebido, troco, dataHora]
      properties:
        id: {type: integer}
        forma: {$ref: '#/components/schemas/FormaPagamentoPedido'}
        status: {type: string, enum: [PAGO, PENDENTE, CANCELADO]}
        valor: {$ref: '#/components/schemas/DinheiroPedido'}
        valorRecebido: {type: number, nullable: true, description: Null se não informado no pagamento em dinheiro ou se a forma não for DINHEIRO.}
        troco: {type: number, nullable: true, description: Calculado somente quando houver valor recebido em DINHEIRO; null nos demais casos.}
        dataHora: {type: string, description: DATETIME como texto, sem conversão de fuso.}
    PedidoResumo:
      type: object
      required: [id, idCaixa, dataHora, status, tipoAtendimento, nomeCliente, valorTotal, formaPagamento, statusPagamento, nomeUsuario, horaPronto, horaSaiuEntrega, motivoCancelamento, horaCancelamento, idUsuarioCancelamento, nomeUsuarioCancelamento]
      properties:
        horaPronto: {type: string, nullable: true, example: '2026-10-25 12:30:00', description: DATETIME gravado ao marcar PRONTO.}
        horaSaiuEntrega: {type: string, nullable: true, example: '2026-10-25 12:40:00', description: DATETIME gravado ao marcar SAIU_ENTREGA.}
        motivoCancelamento: {type: string, nullable: true, maxLength: 255}
        horaCancelamento: {type: string, nullable: true}
        idUsuarioCancelamento: {type: integer, nullable: true}
        nomeUsuarioCancelamento: {type: string, nullable: true}
        id: {type: integer}
        idCaixa: {type: integer}
        dataHora: {type: string}
        status: {$ref: '#/components/schemas/StatusPedido'}
        tipoAtendimento: {$ref: '#/components/schemas/TipoAtendimento'}
        nomeCliente: {type: string, nullable: true}
        valorTotal: {$ref: '#/components/schemas/DinheiroPedido'}
        formaPagamento: {$ref: '#/components/schemas/FormaPagamentoPedido'}
        statusPagamento: {type: string, enum: [PAGO, PENDENTE, CANCELADO]}
        nomeUsuario: {type: string}
    Pedido:
      type: object
      required: [id, idCaixa, idUsuario, nomeUsuario, idCliente, nomeCliente, dataHora, status, tipoAtendimento, enderecoEntrega, observacao, valorTotal, itens, pagamento, horaPronto, horaSaiuEntrega, motivoCancelamento, horaCancelamento, idUsuarioCancelamento, nomeUsuarioCancelamento]
      properties:
        horaPronto: {type: string, nullable: true, example: '2026-10-25 12:30:00', description: DATETIME gravado ao marcar PRONTO.}
        horaSaiuEntrega: {type: string, nullable: true, example: '2026-10-25 12:40:00', description: DATETIME gravado ao marcar SAIU_ENTREGA.}
        motivoCancelamento: {type: string, nullable: true, maxLength: 255}
        horaCancelamento: {type: string, nullable: true}
        idUsuarioCancelamento: {type: integer, nullable: true}
        nomeUsuarioCancelamento: {type: string, nullable: true}
        id: {type: integer}
        idCaixa: {type: integer}
        idUsuario: {type: integer}
        nomeUsuario: {type: string}
        idCliente: {type: integer, nullable: true}
        nomeCliente: {type: string, nullable: true}
        dataHora: {type: string, description: DATETIME do banco, sem restringir ao dia informado para o cardápio.}
        status: {$ref: '#/components/schemas/StatusPedido'}
        tipoAtendimento: {$ref: '#/components/schemas/TipoAtendimento'}
        enderecoEntrega: {type: string, nullable: true}
        observacao: {type: string, nullable: true}
        valorTotal: {$ref: '#/components/schemas/DinheiroPedido'}
        itens:
          type: array
          items: {$ref: '#/components/schemas/PedidoItem'}
        pagamento: {$ref: '#/components/schemas/PedidoPagamento'}
    Estoque:
      type: object
      required: [id, nome, categoria, siglaUnidade, quantidade, estoqueMinimo, abaixoDoMinimo, ativo]
      properties:
        id:
          type: integer
          description: ID do insumo, mesmo quando ele ainda não tem uma linha em estoque.
          example: 1
        nome:
          type: string
          example: Arroz
        categoria:
          type: string
          example: Grãos
        siglaUnidade:
          type: string
          example: kg
        quantidade:
          type: number
          minimum: 0
          maximum: 9999999.999
          multipleOf: 0.001
          example: 7
        estoqueMinimo:
          type: number
          minimum: 0
          maximum: 9999999.999
          multipleOf: 0.001
          example: 10
        abaixoDoMinimo:
          type: boolean
          description: Comparação estrita entre quantidade e estoqueMinimo.
          example: true
        ativo:
          type: boolean
          example: true
    TipoMovimentacaoEstoque:
      type: string
      enum: [ENTRADA_COMPRA, PERDA, AJUSTE_ENTRADA, AJUSTE_SAIDA]
    MovimentacaoEstoqueEntrada:
      type: object
      required: [idInsumo, tipo, quantidade]
      properties:
        idInsumo:
          type: integer
          minimum: 1
          description: Deve existir e estar ativo.
        tipo:
          $ref: '#/components/schemas/TipoMovimentacaoEstoque'
        quantidade:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 9999999.999
          multipleOf: 0.001
        motivo:
          type: string
          nullable: true
          maxLength: 255
          description: Obrigatório com pelo menos 3 caracteres para PERDA, AJUSTE_ENTRADA e AJUSTE_SAIDA. Opcional para ENTRADA_COMPRA.
    MovimentacaoEstoque:
      type: object
      required: [id, idInsumo, nomeInsumo, siglaUnidade, idUsuario, nomeUsuario, tipo, quantidade, motivo, dataHora]
      properties:
        id:
          type: integer
          example: 2
        idInsumo:
          type: integer
          example: 1
        nomeInsumo:
          type: string
          example: Arroz
        siglaUnidade:
          type: string
          example: kg
        idUsuario:
          type: integer
          description: Usuário autenticado que registrou a movimentação.
          example: 3
        nomeUsuario:
          type: string
          example: Maria Silva
        tipo:
          $ref: '#/components/schemas/TipoMovimentacaoEstoque'
        quantidade:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 9999999.999
          multipleOf: 0.001
          description: Sempre positiva; o tipo determina o efeito sobre o saldo.
          example: 3
        motivo:
          type: string
          nullable: true
          maxLength: 255
          example: Produto vencido
        dataHora:
          type: string
          description: DATETIME como texto, preservando o horário registrado pelo banco, sem conversão de fuso horário.
          example: '2026-10-19 14:30:00'
    MovimentacaoEstoqueResultado:
      type: object
      required: [movimentacao, novoSaldo]
      properties:
        movimentacao:
          $ref: '#/components/schemas/MovimentacaoEstoque'
        novoSaldo:
          type: number
          minimum: 0
          maximum: 9999999.999
          multipleOf: 0.001
          example: 7
    CaixaAbertura:
      type: object
      required: [valorAbertura]
      properties:
        valorAbertura:
          type: number
          minimum: 0
          maximum: 99999999.99
          multipleOf: 0.01
          description: Troco inicial; zero é permitido. Não aceita string nem valor ausente.
    CaixaFechamento:
      type: object
      required: [valorFechamento]
      properties:
        valorFechamento:
          type: number
          minimum: 0
          maximum: 99999999.99
          multipleOf: 0.01
          description: Dinheiro contado na gaveta; zero e divergência de conferência são permitidos. Não aceita string nem valor ausente.
        idCaixa:
          type: integer
          minimum: 1
          description: Opcional; ID do caixa conferido na tela. Evita fechar outro caixa aberto após uma confirmação antiga.
    ResumoCaixa:
      type: object
      required: [idCaixa, status, valorAbertura, totalDinheiro, totalPix, totalDebito, totalCredito, totalFiado, totalRecebido, totalVendido, saldoEsperadoDinheiro, valorFechamento, diferenca, quantidadePagamentos]
      properties:
        idCaixa: {type: integer, minimum: 1}
        status: {type: string, enum: [ABERTO, FECHADO]}
        valorAbertura: {type: number, minimum: 0, multipleOf: 0.01, description: Dinheiro físico inicial; não representa venda.}
        totalDinheiro: {type: number, minimum: 0, multipleOf: 0.01}
        totalPix: {type: number, minimum: 0, multipleOf: 0.01}
        totalDebito: {type: number, minimum: 0, multipleOf: 0.01}
        totalCredito: {type: number, minimum: 0, multipleOf: 0.01}
        totalFiado: {type: number, minimum: 0, multipleOf: 0.01, description: FIADO PENDENTE; não recebido.}
        totalRecebido: {type: number, minimum: 0, multipleOf: 0.01}
        totalVendido: {type: number, minimum: 0, multipleOf: 0.01, description: Total recebido + fiado pendente.}
        saldoEsperadoDinheiro: {type: number, minimum: 0, multipleOf: 0.01, description: Abertura + vendas PAGO em DINHEIRO.}
        valorFechamento: {type: number, minimum: 0, multipleOf: 0.01, nullable: true}
        diferenca: {type: number, multipleOf: 0.01, nullable: true, description: Valor contado menos saldo esperado; null em caixa aberto.}
        quantidadePagamentos:
          type: object
          required: [dinheiro, pix, debito, credito, fiado]
          properties:
            dinheiro: {type: integer, minimum: 0}
            pix: {type: integer, minimum: 0}
            debito: {type: integer, minimum: 0}
            credito: {type: integer, minimum: 0}
            fiado: {type: integer, minimum: 0}
    Caixa:
      type: object
      required: [id, idUsuarioAbertura, nomeUsuarioAbertura, idUsuarioFechamento, nomeUsuarioFechamento, dataAbertura, dataFechamento, valorAbertura, valorFechamento, status]
      properties:
        id:
          type: integer
          example: 1
        idUsuarioAbertura:
          type: integer
          example: 2
        nomeUsuarioAbertura:
          type: string
          example: Maria Silva
        idUsuarioFechamento:
          type: integer
          nullable: true
          example: null
        nomeUsuarioFechamento:
          type: string
          nullable: true
          description: Nome do usuário que fechou; null enquanto o caixa estiver aberto.
          example: null
        dataAbertura:
          type: string
          description: DATETIME como texto, conforme dateStrings do mysql2; sem conversão de fuso horário.
          example: '2026-10-11 11:00:00'
        dataFechamento:
          type: string
          nullable: true
          example: null
        valorAbertura:
          type: number
          minimum: 0
          maximum: 99999999.99
          example: 100
        valorFechamento:
          type: number
          nullable: true
          minimum: 0
          maximum: 99999999.99
          description: Dinheiro físico contado na gaveta; null enquanto o caixa estiver aberto. Conferência disponível no endpoint de resumo.
          example: null
        status:
          type: string
          enum: [ABERTO, FECHADO]
          example: ABERTO
    Erro:
      type: object
      required: [msg]
      properties:
        msg:
          type: string
          description: Mensagem de erro em português.
    Mensagem:
      type: object
      required: [msg]
      properties:
        msg:
          type: string
          description: Mensagem de confirmação em português.
    Ativo:
      description: O mysql2 devolve BOOLEAN como 0 ou 1; entidades criadas ou atualizadas também podem devolver booleanos JSON.
      oneOf:
        - type: boolean
        - type: integer
          enum: [0, 1]
    DecimalSaida:
      description: DECIMAL é devolvido como string pelo mysql2; respostas de criação ou atualização também podem conter número.
      oneOf:
        - type: number
        - type: string
          pattern: '^-?\d+(\.\d+)?$'
    CriadoEm:
      type: string
      description: Data e hora do banco com dateStrings, quando disponíveis; pode ser omitido na resposta de criação.
      example: '2026-10-08 08:30:00'
    Perfil:
      type: string
      enum: [ADMIN, ATENDENTE, COZINHA]
    LoginEntrada:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          example: pessoa@example.com
        senha:
          type: string
          format: password
          writeOnly: true
          description: Senha da conta existente; preencha somente ao executar. Sem valor de exemplo.
    Usuario:
      type: object
      description: Dados públicos do usuário; senha e seu hash não são serializados.
      required: [id, nome, email, perfil, ativo]
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: Maria Silva
        email:
          type: string
          example: maria@example.com
        perfil:
          $ref: '#/components/schemas/Perfil'
        ativo:
          $ref: '#/components/schemas/Ativo'
        criadoEm:
          $ref: '#/components/schemas/CriadoEm'
    UsuarioCriacao:
      type: object
      required: [nome, email, senha, perfil]
      properties:
        nome:
          type: string
          minLength: 2
          example: Maria Silva
        email:
          type: string
          description: Deve conter arroba.
          example: maria@example.com
        senha:
          type: string
          format: password
          writeOnly: true
          description: Senha de entrada, sem exemplo. Não é devolvida pela API.
        perfil:
          $ref: '#/components/schemas/Perfil'
    UsuarioAtualizacao:
      type: object
      properties:
        nome:
          type: string
          minLength: 2
        email:
          type: string
        perfil:
          $ref: '#/components/schemas/Perfil'
        ativo:
          type: boolean
    Categoria:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: Grãos
        descricao:
          type: string
          nullable: true
          example: Grãos e cereais
        ativo:
          $ref: '#/components/schemas/Ativo'
    Unidade:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: Quilograma
        sigla:
          type: string
          example: kg
    ProdutoEntrada:
      type: object
      description: Na criação, ativo é ignorado e o produto nasce ativo. Na edição todos os campos são opcionais.
      properties:
        usaCardapio:
          type: boolean
          description: Padrão true na criação; quando omitido na edição, preserva o valor atual.
        nome:
          type: string
          minLength: 2
        descricao:
          type: string
          nullable: true
        preco_padrao:
          type: number
          minimum: 0
          exclusiveMinimum: true
        ativo:
          type: boolean
    Produto:
      type: object
      properties:
        usaCardapio:
          type: boolean
          example: true
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: Marmita G
        descricao:
          type: string
          nullable: true
          example: Marmita grande
        precoPadrao:
          $ref: '#/components/schemas/DecimalSaida'
        ativo:
          $ref: '#/components/schemas/Ativo'
        criadoEm:
          $ref: '#/components/schemas/CriadoEm'
    InsumoEntrada:
      type: object
      description: Na criação, ativo é ignorado e o insumo nasce ativo. Na edição todos os campos são opcionais.
      properties:
        nome:
          type: string
          minLength: 2
        id_categoria:
          type: integer
          minimum: 1
        id_unidade:
          type: integer
          minimum: 1
        classificacao:
          type: string
          enum: [INSUMO, VENDA_DIRETA]
        preco_custo:
          type: number
          minimum: 0
          exclusiveMinimum: true
        preco_venda:
          type: number
          description: Obrigatoriamente positivo quando classificacao é VENDA_DIRETA.
        estoque_minimo:
          type: number
          minimum: 0
        ativo:
          type: boolean
    Insumo:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: Arroz cru
        idCategoria:
          type: integer
          example: 1
        idUnidade:
          type: integer
          example: 1
        classificacao:
          type: string
          enum: [INSUMO, VENDA_DIRETA]
        precoCusto:
          $ref: '#/components/schemas/DecimalSaida'
        precoVenda:
          $ref: '#/components/schemas/DecimalSaida'
        estoqueMinimo:
          $ref: '#/components/schemas/DecimalSaida'
        ativo:
          $ref: '#/components/schemas/Ativo'
        criadoEm:
          $ref: '#/components/schemas/CriadoEm'
    InsumoDetalhado:
      allOf:
        - $ref: '#/components/schemas/Insumo'
        - type: object
          properties:
            nomeCategoria:
              type: string
              example: Grãos
            nomeUnidade:
              type: string
              example: Quilograma
            siglaUnidade:
              type: string
              example: kg
    ClienteEntrada:
      type: object
      description: Na criação, ativo é ignorado e o cliente nasce ativo. Na edição todos os campos são opcionais.
      properties:
        nome:
          type: string
          minLength: 1
        telefone:
          type: string
          nullable: true
        ativo:
          type: boolean
    Cliente:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: Maria Silva
        telefone:
          type: string
          nullable: true
          example: '18999990000'
        ativo:
          $ref: '#/components/schemas/Ativo'
        criadoEm:
          $ref: '#/components/schemas/CriadoEm'
    AdicionalEntrada:
      type: object
      description: Na criação, ativo é ignorado e o adicional nasce ativo. Na edição todos os campos são opcionais; null remove os vínculos opcionais.
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 100
        preco:
          type: number
          minimum: 0.01
          maximum: 99999999.99
          multipleOf: 0.01
          description: Preço numérico obrigatório na criação, maior que zero, com até duas casas decimais.
        ativo:
          type: boolean
        id_insumo:
          type: integer
          minimum: 1
          nullable: true
          description: Deve existir, se preenchido. Vínculo informativo, sem baixa automática de estoque.
        quantidade_consumida:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 9999999.999
          multipleOf: 0.001
          nullable: true
    Adicional:
      type: object
      required: [id, nome, preco, ativo, idInsumo, quantidadeConsumida]
      properties:
        id:
          type: integer
          example: 3
        nome:
          type: string
          example: Ovo extra
        preco:
          type: number
          minimum: 0.01
          maximum: 99999999.99
          multipleOf: 0.01
          example: 2.5
        ativo:
          type: boolean
        idInsumo:
          type: integer
          nullable: true
          example: null
        quantidadeConsumida:
          type: number
          nullable: true
          example: null
    Preparacao:
      type: object
      required: [nome, grupo]
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 150
          example: Carne
        grupo:
          type: string
          nullable: true
          enum: [null, Mistura]
          description: null para item fixo, Mistura para uma alternativa. É obrigatório informar o campo, mesmo quando null.
    AdicionalDoDia:
      type: object
      required: [id, nome, preco]
      properties:
        id:
          type: integer
          example: 3
        nome:
          type: string
          example: Ovo extra
        preco:
          type: number
          example: 2.5
    CardapioEntrada:
      type: object
      required: [data, preparacoes, adicionais]
      properties:
        data:
          type: string
          format: date
        preparacoes:
          type: array
          description: Sem limite de opções; a posição no array define a ordem.
          items:
            $ref: '#/components/schemas/Preparacao'
        adicionais:
          type: array
          uniqueItems: true
          description: IDs de adicionais existentes e ativos, sem repetição.
          items:
            type: integer
            minimum: 1
    Cardapio:
      type: object
      required: [id, data, existe, preparacoes, adicionais]
      properties:
        id:
          type: integer
          nullable: true
        data:
          type: string
          format: date
        existe:
          type: boolean
          description: false para uma data sem cadastro.
        preparacoes:
          type: array
          items:
            $ref: '#/components/schemas/Preparacao'
        adicionais:
          type: array
          items:
            $ref: '#/components/schemas/AdicionalDoDia'
